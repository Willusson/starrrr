<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000005" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Звезда" />
    <meta name="format-detection" content="telephone=no" />
    <title>Звезда</title>
    <meta
      name="description"
      content="Звезда — кинематографичная минималистичная сцена: сияющая звезда в глубине космической пустоты."
    />
    <link rel="icon" href="data:," />

    <!-- Fonts (Dancing Script is a calligraphic script with full Cyrillic support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- The scene: CSS void + canvas star + text. All luminous layers are
         composited, no SVG or raster assets are used. -->
    <div class="scene">
      <canvas id="cosmos" class="cosmos" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="glow-fallback" aria-hidden="true"></div>

      <main class="stage">
        <div class="star-mark">
          <span class="star-mark__bloom" aria-hidden="true"></span>
          <h1 class="star-name"><span class="star-name__inner">Звезда</span></h1>
        </div>
      </main>
    </div>

    <script src="star.js" defer></script>
  </body>
</html>
